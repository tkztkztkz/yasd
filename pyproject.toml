[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yahd"
version = "2.2.0"
description = "YAMD - Yet Another Multi Dashboard for Strata and Halogen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "rich",
    "aiohttp",
]

[project.scripts]
yamd = "yamd:main"

[tool.setuptools]
py-modules = ["yamd"]
